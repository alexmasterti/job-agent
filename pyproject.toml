[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.1.0"
description = "Autonomous job application agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "itsdangerous>=2.2.0",
    "starlette>=0.41.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "tenacity>=9.0.0",
    "cryptography>=43.0.0",
    "sentry-sdk[fastapi]>=2.18.0",
    "prometheus-client>=0.21.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "docxtpl>=0.18.0",
    "selectolax>=0.3.0",
    "playwright>=1.48.0",
    "sentence-transformers>=3.3.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "python-jose[cryptography]>=3.3.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "geopy>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "vcrpy>=6.0.0",
    "testcontainers[postgres]>=4.8.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
]

[project.scripts]
job-agent = "job_agent.interfaces.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/job_agent/domain/models/*.py" = ["TCH003"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "docxtpl.*", "vcrpy.*", "apscheduler.*", "arq.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--cov=src/job_agent", "--cov-report=term-missing", "--cov-fail-under=0"]
